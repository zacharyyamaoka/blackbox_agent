# A black-box box's live page, for any box: fold the pushed commit, build the landing + dashboard + the box's own site
# files with blackbox_agent (`blackbox build`), and deploy it to GitHub Pages. A box calls it with six lines (README,
# "Deploy"); its Pages source must be "GitHub Actions" (Settings, Pages).
#
# WHY two jobs: with upload and deploy in one job, deploy-pages twice found "0 artifacts" 0.3 s after a successful
#   upload; GitHub's own static-site template uploads in a build job and deploys in a second job.
# WHY fetch-depth 0: the fold reads git log (each iteration's date and commit, the spec and gate history); the default
#   shallow clone has one commit.
# WHY uvx and nothing else: a box's own deps (often local path deps) cannot install on a runner, and the fold and the
#   build are stdlib + git. A box tool the fold runs that needs a package lists exactly that in
#   .github/fold-requirements.txt, and it is added to the same uvx environment.
name: blackbox site
on:
  workflow_call:
    inputs:
      ref:
        description: "The blackbox_agent version to build with: a moving tag (v0), an exact one (v0.1.0) or a commit"
        type: string
        default: v0
      pages:
        description: "auto: deploy to Pages when the repo is public; always: deploy anyway (a paid plan); never"
        type: string
        default: auto
jobs:
  build:
    runs-on: ubuntu-latest
    # WHY pages: read: configure-pages reads the box's Pages settings (GET /repos/…/pages); contents: read alone cannot
    permissions:
      contents: read
      pages: read
    # WHY the visibility gate (the Agent Activity Agent, 2026-11-25): Pages on a private repo needs a paid plan, so
    #   configure-pages failed every push of a private box. A private box still builds its site on every push (CI
    #   proves it builds); only the Pages steps skip. Asked of the API, so it holds for every event, not only push.
    outputs:
      deploy: ${{ steps.vis.outputs.deploy }}
    steps:
      - id: vis
        name: Pages or not
        env:
          GH_TOKEN: ${{ github.token }}
          PAGES: ${{ inputs.pages }}
        run: |
          private=$(gh api "repos/${GITHUB_REPOSITORY}" --jq .private)
          if [ "$PAGES" = always ] || { [ "$PAGES" = auto ] && [ "$private" = false ]; }; then
            echo deploy=true >> "$GITHUB_OUTPUT"
          else
            echo deploy=false >> "$GITHUB_OUTPUT"
            echo "::notice::Built the site; skipped Pages (private: $private, pages: $PAGES). Pages on a private repo needs a paid plan; pass pages: always to deploy anyway."
          fi
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v6
      - name: blackbox build
        env:
          BLACKBOX_REF: ${{ inputs.ref }}
        run: |
          extra=()
          if [ -f .github/fold-requirements.txt ]; then extra=(--with-requirements .github/fold-requirements.txt); fi
          uvx "${extra[@]}" --from "git+https://github.com/zacharyyamaoka/blackbox_agent@${BLACKBOX_REF}" blackbox build --box . --out _site
      - uses: actions/configure-pages@v5
        if: steps.vis.outputs.deploy == 'true'
      - uses: actions/upload-pages-artifact@v3
        if: steps.vis.outputs.deploy == 'true'
        with:
          path: _site
  deploy:
    needs: build
    if: needs.build.outputs.deploy == 'true'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
